name: Package Scanner VPN 1.14 Android project and engine
on:
  push:
    branches: ['arena/5c83bf87-scannerproject']
    paths: ['web-preview/**', 'Scanner-VPN-Demo.html', 'tools/build-vpn-preview.py', 'tools/package-vpn-1.14-source.sh', '.github/workflows/scanner-vpn-full-source.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/package-vpn-1.14-source.sh
      - name: Attach full project to the existing 1.14 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload scanner-vpn-signed-44561076833 Scanner-VPN-1.14-Android-project.zip Scanner-VPN-Demo.html --clobber
