name: Verify and publish signed Scanner APKs
on:
  push:
    branches: ['arena/5c83bf87-scannerproject']
    paths: ['scanner-vpn/signing/approval.json', '.github/workflows/scanner-vpn-sign.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify approved build
        id: build
        run: echo "run=$(jq -re '.run | select(test("^[0-9]+$"))' scanner-vpn/signing/approval.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run }}
          name: Scanner-VPN-preview
          path: apks
      - name: Attach offline signatures and verify Android identity
        run: |
          set -eu
          python3 scanner-vpn/scripts/apk-envelope.py attach apks 2>envelope.err || { tail -6 envelope.err | while read -r line; do echo "::error::$line"; done; exit 1; }
          verifier=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          fingerprint=$(openssl x509 -in scanner-vpn/signing/update-cert.pem -outform DER | sha256sum | cut -d' ' -f1)
          for f in apks/*.apk; do
            "$verifier" verify --verbose --print-certs --print-certs-pem "$f" > signer.txt 2>&1 || { head -15 signer.txt | while read -r line; do echo "::error::$line"; done; exit 1; }
            grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" signer.txt
            test "$(grep -c -- '-----BEGIN CERTIFICATE-----' signer.txt)" = 1
            sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' signer.txt > verified.pem
            actual=$(openssl x509 -in verified.pem -outform DER | sha256sum | cut -d' ' -f1)
            test "$actual" = "$fingerprint" || { echo '::error::Unexpected APK signing certificate'; exit 1; }
            echo "Verified $f: $actual"
          done
      - name: Publish verified APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --output=Scanner-VPN-source.zip HEAD scanner-vpn .github/workflows/scanner-vpn-preview.yml .github/workflows/scanner-vpn-sign.yml
          gh release create "scanner-vpn-signed-${GITHUB_RUN_ID}" apks/*.apk Scanner-VPN-source.zip --target "$GITHUB_SHA" --title 'Scanner VPN · signed Android client' --prerelease --notes 'APK v2 signature verified against the Scanner VPN update certificate. Use the same CPU variant for updates.'
