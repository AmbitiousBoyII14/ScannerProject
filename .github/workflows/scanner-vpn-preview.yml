name: Scanner VPN preview APK
on:
  push:
    branches: ['arena/5c83bf87-scannerproject']
    paths: ['scanner-vpn/**', '!scanner-vpn/signing/approval.json', '.github/workflows/scanner-vpn-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: scanner-vpn/scripts/fetch-core.sh
      - run: scanner-vpn/scripts/test-and-build.sh
      - name: Package standalone APKs by CPU
        run: |
          mkdir apks
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            apk="scanner-vpn/app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            unzip -Z1 "$apk" > entries.txt
            grep -q "^lib/$abi/" entries.txt
            cp "$apk" "apks/Scanner-VPN-$abi.apk"
          done
      - run: python3 scanner-vpn/scripts/apk-envelope.py request apks
      - uses: actions/upload-artifact@v4
        with:
          name: Scanner-VPN-preview
          path: apks/*.apk
          if-no-files-found: error
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: scanner-vpn/scripts/fetch-core.sh
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd scanner-vpn && ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Instrumentation diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          for file in glob.glob('scanner-vpn/app/build/outputs/androidTest-results/**/*.xml',recursive=True):
              for node in E.parse(file).iter('failure'):
                  for line in (node.attrib.get('message') or node.text or 'instrumentation failure').splitlines()[:5]: print('::error::'+line[:500])
          PY
