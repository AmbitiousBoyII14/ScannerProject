name: Scanner VPN preview APK
on:
  push:
    branches: ['arena/5c83bf87-scannerproject']
    paths: ['scanner-vpn/**', '!scanner-vpn/signing/approval.json', '.github/workflows/scanner-vpn-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: scanner-vpn/scripts/fetch-core.sh
      - run: scanner-vpn/scripts/test-and-build.sh
      - name: Package standalone APKs by CPU
        run: |
          mkdir apks
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            apk="scanner-vpn/app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            unzip -Z1 "$apk" > entries.txt
            grep -q "^lib/$abi/" entries.txt
            cp "$apk" "apks/Scanner-VPN-$abi.apk"
          done
      - run: python3 scanner-vpn/scripts/apk-envelope.py request apks
      - uses: actions/upload-artifact@v4
        with:
          name: Scanner-VPN-preview
          path: apks/*.apk
          if-no-files-found: error
