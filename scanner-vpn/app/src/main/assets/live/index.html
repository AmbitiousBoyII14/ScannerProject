<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>Scanner VPN</title><link rel="stylesheet" href="style.css"><script defer src="ui.js"></script></head><body>
<header><button class="icon" id="menu" aria-label="Open menu">☰</button><h1>Scanner <b>VPN</b></h1><span class="edition">ANDROID / 1.6</span></header>
<nav><button data-view="home" aria-current="page">SSH / VPN</button><button data-view="log">LOG</button><button data-view="batch">BATCH</button></nav><main>
<section id="home"><div class="account"><div class="inputtools"><label for="account">SSH account · host:port@user:pass</label><button id="copy">Copy</button><button id="paste">Paste</button><button id="reveal">Hide</button></div><div class="entry"><input id="account" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="host:port@username:password"></div></div>
<div class="activeProfile"><strong id="profile"></strong><button id="edit">Edit profile</button></div><div id="flags" class="flags"></div><div id="quicktools" class="tools"></div><button id="connect" class="connect">CONNECT</button><p id="status" class="message" role="status"></p><div class="stats"><span id="rates"></span><span id="rtt"></span></div><p id="hint" class="hint"></p></section>
<section id="log" hidden><div class="linehead"><span>SESSION LOG · LIVE</span><button id="stop" hidden>Disconnect</button></div><div class="terminal" id="events"></div><small class="storage"></small></section>
<section id="batch" hidden><label for="domains">Target domains</label><textarea rows="5" id="domains" maxlength="65536" placeholder="One saved server domain per line"></textarea><div class="tools"><button id="savedHosts">Saved domains</button><button id="import">Import .txt</button></div><p class="hint" id="count"></p><button class="connect" id="run">CONNECT BATCH</button><p id="progress" role="status"></p><div id="checks" class="terminal"></div></section></main>
<dialog id="drawer"><div class="drawtop"><strong>Scanner VPN</strong><small>Connection tools</small></div><div id="links"></div><button id="closeMenu" class="dismiss">Close menu</button></dialog>
<dialog id="sheet"><div class="dialoghead"><h2 id="title"></h2><button id="dismiss" class="icon" aria-label="Close">×</button></div><div id="body"></div></dialog></body></html>
