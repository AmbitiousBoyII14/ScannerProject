<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="theme-color" content="#1c1f24"><title>Scanner VPN · Tunnel</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><section id="workspace"><header class="bar"><button class="ic" id="burger" aria-label="Open navigation drawer"></button><h1><span class="brand">Scanner</span> VPN</h1><button class="ic" id="plugins" aria-label="Protocol settings"></button><button class="ic" id="cloud" aria-label="Configuration actions"></button><button class="ic" id="more" aria-label="More settings"></button></header><nav><button data-tab="home" aria-current="page">SSH</button><button data-tab="log">LOG</button><button data-tab="batch">BATCH</button></nav>
<section id="home" class="pane"><input id="account" aria-label="SSH account" placeholder="ip:port@user:pass" autocomplete="off" spellcheck="false" hidden><div class="grid" id="flags"></div><button class="outline" id="connect">CONNECT</button><p class="state" id="status" role="status"></p></section>
<section id="log" class="pane" hidden><ul class="trace" id="events"></ul><div class="actions"><button id="copy">COPY LOG</button><button id="export">EXPORT .TXT</button></div><p class="hint" id="logHint"></p></section>
<section id="batch" class="pane" hidden><button id="openLab" class="outline">Open Batch Lab · $$ templates</button><label class="field"><strong>Connection test</strong><select id="batchKind"><option value="web">Website status (HTTPS)</option><option value="sshAlias">Live SSH TLS · $$ account host</option><option value="alias">Live V2ray · $$ aliases</option><option value="vpn">Saved VPN profiles</option></select></label><button id="editAlias" hidden class="outline">Edit V2ray template</button><label class="field" id="patternField"><strong>Request template</strong><small>$$ = the domain from each line</small><input id="pattern" value="https://$$/" spellcheck="false"></label><label class="field"><strong>Domain list</strong><textarea placeholder="One domain per line" rows="4" id="targets" spellcheck="false"></textarea></label><div class="actions"><button id="importTxt">IMPORT .TXT</button><button id="scanSettings">TIMEOUT & RETRY</button></div><p class="hint" id="batchProfile"></p><button class="outline" id="scan">START BATCH</button><p id="batchInputError" class="error" role="alert"></p><p class="state" id="progress" role="status"></p><button class="outline" id="report" hidden>EXPORT OUTPUT.TXT</button><div id="webBoard"></div><div id="results"></div><ul class="trace" id="batchLog"></ul></section>
<div class="fabset" id="speed"><button class="fabact" data-action="Save Config" hidden>Save Config　▣</button><button class="fabact" data-action="Open Config" hidden>Open Config　↗</button><button class="fabact" data-action="Cloud Config" hidden>Cloud Config　☁</button><button class="fab" id="plus" aria-label="Configuration actions" aria-expanded="false">+</button></div></section>
<section id="detail" class="panel" hidden><div class="bar"><button class="ic" id="back" aria-label="Back"></button><h2 id="detailTitle"></h2><div class="actions" id="detailTools"></div></div><div id="content"></div></section><small class="marknote">SCANNER VPN · ANDROID 1.19</small><div class="scrim" id="shade" hidden></div><aside class="drawer" id="drawer" aria-label="Navigation" hidden></aside><aside class="popup" id="popup" aria-label="Actions" hidden></aside></div>
<dialog id="sheet"><div class="modalhead"><h2 id="title"></h2><button id="dismiss" aria-label="Close">×</button></div><form id="form"><div id="fields"></div><p class="error" id="error"></p><button class="apply" id="apply">APPLY</button></form></dialog><input type="file" class="file" id="file"><script src="core-editor.js"></script><script src="ui.js"></script></body></html>
