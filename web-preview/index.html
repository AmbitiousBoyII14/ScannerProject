<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Scanner Custom · Web preview</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body>
<header><button class="icon" id="menu" aria-label="Open menu">☰</button><h1>Scanner <b>Custom</b></h1><button class="icon" id="reset" aria-label="Reset current input" title="Reset input"><svg viewBox="0 0 24 24"><path d="M4 6h16M9 6V4h6v2M7 6l1 15h8l1-15"/></svg></button><button class="icon" id="load" aria-label="Load sample" title="Load sample"><svg viewBox="0 0 24 24"><path d="M4 16v4h16v-4M12 3v12m-5-5 5 5 5-5"/></svg></button><button class="icon" id="more" aria-label="Preview options">⋮</button></header>
<nav aria-label="Main tabs"><button data-page="ssh" aria-current="page">SSH</button><button data-page="log">LOG</button><button data-page="batch">BATCH</button></nav>
<main><section id="ssh" class="screen"><div class="account"><label for="account">ip:port@user:pass</label><div class="entry"><input id="account" type="password" placeholder="gateway.example:443@demo:password" autocomplete="off" spellcheck="false" autocapitalize="none"><button class="icon eye" id="eye" aria-label="Show account line">◉</button></div></div><div class="flags" id="flags"></div><button class="connect" id="connect">CONNECT</button><div class="message" id="sshStatus" role="status"></div></section>
<section id="log" class="screen" hidden><div class="linehead"><span>SESSION LOG</span><button id="clearLog">Clear</button></div><div id="events" role="log" aria-label="Demo connection events"></div></section>
<section id="batch" class="screen" hidden><label for="domains">Target domains</label><textarea id="domains" rows="4" placeholder="gateway.example&#10;timeout.example" spellcheck="false" autocapitalize="none"></textarea><div class="tools"><button id="sample">Sample list</button><button id="import">Import .txt</button><input hidden type="file" id="file" accept=".txt,text/plain"></div><p class="hint" id="count"></p><button id="run" class="connect">CONNECT BATCH</button><div id="batchStatus" class="message" role="status"></div><div id="results"></div></section>
<div class="previewnote"><span></span> WEB PREVIEW <i>·</i> Simulated connections only</div></main><button class="fab" id="add" aria-label="Open tools">＋</button>
<dialog id="drawer"><div class="drawtop"><div class="monogram">SC</div><strong>Scanner Custom</strong><small>Android layout · Web edition</small></div><div id="links"></div><button class="dismiss" id="closeMenu">Close menu</button></dialog>
<dialog id="sheet"><div class="dialoghead"><h2 id="sheetTitle"></h2><button class="icon" id="dismiss" aria-label="Close dialog">×</button></div><div id="body"></div><button class="apply" id="apply">Apply</button></dialog>
</body></html>
